---
joint_state_estimator:
  ros__parameters:
    type: linear_feedback_controller/JointStateEstimator
    state_interfaces:
    - fr3_joint1/position
    - fr3_joint2/position
    - fr3_joint3/position
    - fr3_joint4/position
    - fr3_joint5/position
    - fr3_joint6/position
    - fr3_joint7/position
    - fr3_joint1/velocity
    - fr3_joint2/velocity
    - fr3_joint3/velocity
    - fr3_joint4/velocity
    - fr3_joint5/velocity
    - fr3_joint6/velocity
    - fr3_joint7/velocity
    - fr3_joint1/effort
    - fr3_joint2/effort
    - fr3_joint3/effort
    - fr3_joint4/effort
    - fr3_joint5/effort
    - fr3_joint6/effort
    - fr3_joint7/effort
    command_interfaces:
    - linear_feedback_controller/fr3_joint1/position
    - linear_feedback_controller/fr3_joint2/position
    - linear_feedback_controller/fr3_joint3/position
    - linear_feedback_controller/fr3_joint4/position
    - linear_feedback_controller/fr3_joint5/position
    - linear_feedback_controller/fr3_joint6/position
    - linear_feedback_controller/fr3_joint7/position
    - linear_feedback_controller/fr3_joint1/velocity
    - linear_feedback_controller/fr3_joint2/velocity
    - linear_feedback_controller/fr3_joint3/velocity
    - linear_feedback_controller/fr3_joint4/velocity
    - linear_feedback_controller/fr3_joint5/velocity
    - linear_feedback_controller/fr3_joint6/velocity
    - linear_feedback_controller/fr3_joint7/velocity
    - linear_feedback_controller/fr3_joint1/effort
    - linear_feedback_controller/fr3_joint2/effort
    - linear_feedback_controller/fr3_joint3/effort
    - linear_feedback_controller/fr3_joint4/effort
    - linear_feedback_controller/fr3_joint5/effort
    - linear_feedback_controller/fr3_joint6/effort
    - linear_feedback_controller/fr3_joint7/effort

linear_feedback_controller:
  ros__parameters:
    type: linear_feedback_controller/LinearFeedbackController
    moving_joint_names:
    - fr3_joint1
    - fr3_joint2
    - fr3_joint3
    - fr3_joint4
    - fr3_joint5
    - fr3_joint6
    - fr3_joint7
    fr3_joint1:
      p: 1000.0
      d: 5.0
    fr3_joint2:
      p: 1000.0
      d: 5.0
    fr3_joint3:
      p: 1000.0
      d: 5.0
    fr3_joint4:
      p: 1000.0
      d: 2.0
    fr3_joint5:
      p: 20.0
      d: 2.0
    fr3_joint6:
      p: 10.0
      d: 2.0
    fr3_joint7:
      p: 5.0
      d: 1.0
    chainable_controller:
      command_interfaces:
      - fr3_joint1/effort
      - fr3_joint2/effort
      - fr3_joint3/effort
      - fr3_joint4/effort
      - fr3_joint5/effort
      - fr3_joint6/effort
      - fr3_joint7/effort
      refr3ence_prefix: ''
    joint_velocity_filter_coefficient: 0.9
    pd_to_lf_transition_duration: 0.1
    remove_gravity_compensation_effort: true
    robot_has_free_flyer: false
